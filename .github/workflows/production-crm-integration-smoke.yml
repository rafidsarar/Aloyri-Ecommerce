name: Production CRM integration smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront-to-crm:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify public catalog sync and field whitelist
        shell: bash
        run: |
          set -euo pipefail
          catalog=""
          for attempt in {1..12}; do
            if catalog=$(curl --fail --silent --show-error \
              https://aloyri-ecommerce.vercel.app/api/catalog); then
              break
            fi
            sleep 5
          done
          test -n "$catalog"
          CATALOG_JSON="$catalog" python - <<'PY'
          import json, os
          data=json.loads(os.environ["CATALOG_JSON"])
          products=data.get("products")
          assert isinstance(products,list) and products, "catalog must contain products"
          required={"id","name","brand","size","category","price","active","availableStock"}
          optional={"salePrice","promotionBadge","slug","description","routineStep","skinNote","texture","bestFor","howToUse","careNotes","ingredientNote","featured","bestseller","mediaPath","merchandisingBadge","merchandisingPriority","merchandisingOutOfStockMode"}
          allowed=required|optional
          for product in products:
              assert set(product) <= allowed, f"unexpected catalog fields: {set(product)-allowed}"
              assert required <= set(product)
              assert isinstance(product["id"],str) and product["id"], "product id must be present"
              assert isinstance(product["price"],(int,float)) and product["price"]>=0
              assert isinstance(product["availableStock"],int) and product["availableStock"]>=0
              if "salePrice" in product:
                  assert isinstance(product["salePrice"],(int,float))
                  assert 0 <= product["salePrice"] < product["price"]
              if "promotionBadge" in product:
                  assert isinstance(product["promotionBadge"],str)
                  assert 0 < len(product["promotionBadge"]) <= 40
              if "merchandisingBadge" in product:
                  assert isinstance(product["merchandisingBadge"],str)
                  assert 0 < len(product["merchandisingBadge"]) <= 24
              if "merchandisingPriority" in product:
                  assert isinstance(product["merchandisingPriority"],int)
                  assert -1000 <= product["merchandisingPriority"] <= 1000
              if "merchandisingOutOfStockMode" in product:
                  assert product["merchandisingOutOfStockMode"] in {"keep","push-down","hide"}
          forbidden={"cost","unitCost","batchId","supplierId","targetQty","reorderAt","holds","finance","ownerId"}
          text=json.dumps(data)
          for key in forbidden:
              assert f'"{key}"' not in text, f"sensitive field leaked: {key}"
          PY

      - name: Verify order tracking bridge without customer data
        shell: bash
        run: |
          set -euo pipefail
          body='{"orderNumber":"WEB-SMOKE-DOES-NOT-EXIST","phone":"01700000000"}'
          status=$(curl --fail-with-body --retry 3 --retry-delay 5 --retry-all-errors \
            --silent --show-error \
            -o tracking-response.json -w "%{http_code}" \
            -H "content-type: application/json" \
            --data "$body" \
            https://aloyri-ecommerce.vercel.app/api/track-order || true)
          cat tracking-response.json
          test "$status" = "404"
          grep -q '"code":"TRACKING_NOT_FOUND"' tracking-response.json

      - name: Verify Inside Dhaka and Outside Dhaka order bridge
        shell: bash
        run: |
          set -euo pipefail
          test_zone() {
            zone="$1"
            ref="SMOKE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${zone}"
            body=$(cat <<JSON
          {"externalOrderId":"$ref","customer":{"name":"Aloyri Integration Smoke Test","phone":"01700000000","address":"Aloyri production smoke test only","district":"Dhaka","area":"Test","landmark":"","notes":"Non-persisting integration smoke test"},"items":[{"productId":"aloyri-missing-smoke-product","qty":1}],"deliveryZone":"$zone","paymentMethod":"COD"}
          JSON
            )
            status=$(curl --fail-with-body --retry 3 --retry-delay 5 --retry-all-errors \
              --silent --show-error \
              -o response.json -w "%{http_code}" \
              -H "content-type: application/json" \
              --data "$body" \
              https://aloyri-ecommerce.vercel.app/api/orders || true)
            cat response.json
            test "$status" = "409"
            grep -q '"code":"PRODUCT_UNAVAILABLE"' response.json
          }
          test_zone inside-dhaka
          test_zone outside-dhaka
