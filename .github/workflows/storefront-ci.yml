name: Storefront CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Database regression checks
        run: npm run test:audit

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E certification
        run: npm run test:e2e

      - name: Save admin UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-previews
          path: test-results/admin-ui-*/**/*.png
          if-no-files-found: ignore

      - name: Save storefront UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-ui-previews
          path: test-results/storefront-*/**/*.png
          if-no-files-found: ignore
